<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Showcase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="site-header">
        <h1>Product Showcase</h1>
    </header>

    <main class="products-container">
        <!-- Product Card 1 -->
        <article class="product-card">
            <img src="img (1).jpg" alt="Minions PLushies" class="product-image">
            <h2 class="product-name">Minions PLushies</h2>
            <p class="product-price">R199.99</p>
            <button type="button" class="add-to-cart-btn">Add to Cart</button>
        </article>

        <!-- Product Card 2 -->
        <article class="product-card">
            <img src="img (2).jpg" alt="Cat PLushies" class="product-image">
            <h2 class="product-name">Cat PLushies</h2>
            <p class="product-price">R149.99</p>
            <button type="button" class="add-to-cart-btn">Add to Cart</button>
        </article>

        <!-- Product Card 3 -->
        <article class="product-card">
            <img src="img (3).jpg" alt="Snorlax XXL PLushies" class="product-image">
            <h2 class="product-name">Snorlax XXL PLushies</h2>
            <p class="product-price">R259.99</p>
            <button type="button" class="add-to-cart-btn">Add to Cart</button>
        </article>

        <!-- Product Card 4 -->
        <article class="product-card">
            <img src="img (4).jpg" alt="Minecraft Chicken PLushies" class="product-image">
            <h2 class="product-name">Minecraft Chicken PLushies</h2>
            <p class="product-price">R99.99</p>
            <button type="button" class="add-to-cart-btn">Add to Cart</button>
        </article>

        <!-- Product Card 5 -->
        <article class="product-card">
            <img src="img (5).jpg" alt="Gen PLushies" class="product-image">
            <h2 class="product-name">Gen PLushies</h2>
            <p class="product-price">R89.99</p>
            <button type="button" class="add-to-cart-btn">Add to Cart</button>
        </article>

        <!-- Product Card 6 -->
        <article class="product-card">
            <img src="img (6).jpg" alt="Bean PLushies" class="product-image">
            <h2 class="product-name">Bean PLushies</h2>
            <p class="product-price">R149.99</p>
            <button type="button" class="add-to-cart-btn">Add to Cart</button>
        </article>
    </main>

</body>
</html>
